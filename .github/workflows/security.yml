name: Security CI

on:
  push:


permissions:
  contents: read

jobs:
  secret-scanning:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python for scanner validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Gitleaks
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Validate fake-secret detection and remediation
        run: python security/scripts/validate_gitleaks.py

      - name: Scan repository history
        run: >-
          gitleaks git . --log-opts="--all" --redact
          --report-format=json
          --report-path="$RUNNER_TEMP/gitleaks-report.json"

      - name: Upload redacted Gitleaks report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install -r security/requirements-sast.txt

      - name: Validate insecure pattern detection and remediation
        run: python security/scripts/validate_semgrep.py

      # Record intentional training-app findings; scanner errors still fail CI.
      - name: Scan application and save JSON report
        run: |
          mkdir -p reports
          semgrep scan --config security/semgrep.yml --strict \
            --metrics=off --disable-version-check --no-rewrite-rule-ids \
            --json --output reports/semgrep.json app

      - name: Upload Semgrep report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep.json
          if-no-files-found: warn
          retention-days: 7

  dependency-scanning:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install -r security/requirements-sca.txt

      - name: Validate vulnerable dependency detection and remediation
        run: python security/scripts/validate_pip_audit.py --report-dir reports

      - name: Audit application dependencies and save JSON report
        run: |
          mkdir -p reports
          python -m pip_audit -r app/requirements.txt --strict \
            --vulnerability-service pypi --format json \
            --aliases on --desc on --progress-spinner off \
            --output reports/pip-audit.json

      - name: Upload dependency reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: reports/pip-audit*.json
          if-no-files-found: warn
          retention-days: 7

  build-and-test:
    name: Build, test and scan container
    needs: [secret-scanning, sast, dependency-scanning]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build --pull -t devsecops-security-app:${{ github.sha }} .

      - name: Run tests inside the built image
        run: >-
          docker run --rm
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly"
          -w /workspace devsecops-security-app:${{ github.sha }}
          python -B -m unittest discover -s tests -v

      - name: Prepare container report directory
        run: mkdir -p reports

      - name: Scan final Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: devsecops-security-app:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          list-all-pkgs: true
          format: json
          output: reports/trivy.json
          exit-code: '0'
          timeout: 10m
          cache-dir: ${{ runner.temp }}/trivy-cache
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Verify container dependency remediation
        run: >-
          python security/scripts/validate_trivy.py
          --image devsecops-security-app:${{ github.sha }}
          --after-report reports/trivy.json
          --cache-dir "$RUNNER_TEMP/trivy-cache"

      - name: Enforce HIGH and CRITICAL container vulnerability policy
        run: trivy convert --scanners vuln --format table --severity HIGH,CRITICAL --exit-code 1 reports/trivy.json

      - name: Upload container vulnerability reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/trivy*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run ZAP baseline and verify HTTP header remediation
        timeout-minutes: 15
        run: >-
          python security/scripts/run_zap.py
          --image devsecops-security-app:${{ github.sha }}
          --zap-image ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
          --report-dir reports/zap

      - name: Enforce DAST alert policy
        run: >-
          python security/scripts/check_zap.py reports/zap/final/zap.json
          --summary reports/zap/summary.json

      - name: Upload ZAP reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/zap/
          if-no-files-found: warn
          retention-days: 7
